<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone do ENCeditor: o pássaro de origami da ENCTEC no estilo
       pôster/zine do app (papel, tinta preta, spray vermelho, borda grossa
       e sombra "carimbada"). -->
  <rect x="5" y="5" width="58" height="58" fill="#111110"/>
  <rect x="1.5" y="1.5" width="57" height="57" fill="#ebe8e1" stroke="#111110" stroke-width="3"/>
  <!-- respingos de spray -->
  <circle cx="11" cy="11" r="2.4" fill="#e1251b"/>
  <circle cx="16.5" cy="7.5" r="1.2" fill="#e1251b"/>
  <!-- pássaro de origami (cabeça à esquerda, asa para cima, cauda para
       baixo), facetas em tinta e spray separadas por vincos de papel -->
  <g stroke="#ebe8e1" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="24,32 50,5 39,37" fill="#111110"/>
    <polygon points="39,37 50,5 53,30" fill="#e1251b"/>
    <polygon points="39,37 53,30 49,54" fill="#111110"/>
    <polygon points="18,34 24,32 39,37 33,47" fill="#e1251b"/>
    <polygon points="33,47 39,37 49,54" fill="#e1251b"/>
    <polygon points="6,29 20,24 24,32 18,34" fill="#111110"/>
  </g>
</svg>
